<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-aria-02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080d"/>
      <stop offset="50%" stop-color="#111322"/>
      <stop offset="100%" stop-color="#050509"/>
    </linearGradient>
    <linearGradient id="accent-aria-02" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid-aria-02" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow-aria-02" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-aria-02)"/>
  <rect width="800" height="600" fill="url(#grid-aria-02)"/>

  <!-- Radial Glow Mesh -->
  <circle cx="400" cy="300" r="320" fill="url(#glow-aria-02)"/>

  <!-- Corner Tech Accents -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" rx="16"/>
  <path d="M 24 64 L 24 24 L 64 24" fill="none" stroke="#00f0ff" stroke-width="4"/>
  <path d="M 776 64 L 776 24 L 736 24" fill="none" stroke="#00f0ff" stroke-width="4"/>
  <path d="M 24 536 L 24 576 L 64 576" fill="none" stroke="#3b82f6" stroke-width="4"/>
  <path d="M 776 536 L 776 576 L 736 576" fill="none" stroke="#3b82f6" stroke-width="4"/>

  <!-- Center Card Frame -->
  <rect x="60" y="70" width="680" height="460" fill="rgba(15, 17, 28, 0.85)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" rx="16"/>

  <!-- Graphic Wave and Tech Grid lines -->
  <path d="M 90 350 Q 220 220 350 350 T 610 350 T 710 350" fill="none" stroke="url(#accent-aria-02)" stroke-width="4"/>
  <path d="M 90 350 Q 220 450 350 350 T 610 350 T 710 350" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,6" opacity="0.7"/>

  <!-- Data Nodes -->
  <circle cx="350" cy="350" r="8" fill="#00f0ff"/>
  <circle cx="610" cy="350" r="8" fill="#3b82f6"/>
  <circle cx="350" cy="350" r="18" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.6"/>
  <circle cx="610" cy="350" r="18" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>

  <!-- Top Badge -->
  <rect x="90" y="100" width="220" height="32" fill="rgba(255,255,255,0.08)" stroke="url(#accent-aria-02)" stroke-width="1.2" rx="8"/>
  <text x="106" y="121" fill="#00f0ff" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2.5">LIVE METRICS</text>

  <!-- Title and Subtext -->
  <text x="90" y="185" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-1">ARIA VOICE AI</text>
  <text x="90" y="222" fill="rgba(255,255,255,0.75)" font-family="monospace" font-size="14">Live Neural Transcription &amp; Intent Detection</text>

  <!-- Footer Info Strip -->
  <g transform="translate(90, 480)">
    <circle cx="8" cy="8" r="4" fill="#00f0ff"/>
    <circle cx="8" cy="8" r="8" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>
    <text x="26" y="12" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="12" letter-spacing="1.5">PRODUCTION VERIFIED /// 100% ONLINE</text>
  </g>

  <g transform="translate(640, 480)">
    <text x="0" y="12" fill="#3b82f6" font-family="monospace" font-size="14" font-weight="bold">v2.4.0</text>
  </g>
</svg>