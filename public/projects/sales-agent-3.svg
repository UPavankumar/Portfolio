<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#12131e"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <circle cx="400" cy="300" r="280" fill="url(#glow)"/>

  <rect x="30" y="30" width="740" height="540" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" rx="16"/>
  <path d="M 30 70 L 30 30 L 70 30" fill="none" stroke="#a855f7" stroke-width="3"/>
  <path d="M 770 70 L 770 30 L 730 30" fill="none" stroke="#a855f7" stroke-width="3"/>
  <path d="M 30 530 L 30 570 L 70 570" fill="none" stroke="#ec4899" stroke-width="3"/>
  <path d="M 770 530 L 770 570 L 730 570" fill="none" stroke="#ec4899" stroke-width="3"/>

  <rect x="70" y="80" width="660" height="440" fill="rgba(18, 19, 30, 0.7)" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="12"/>

  <path d="M 100 340 Q 200 240 300 340 T 500 340 T 700 340" fill="none" stroke="url(#accent)" stroke-width="4"/>
  <path d="M 100 340 Q 200 420 300 340 T 500 340 T 700 340" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>

  <circle cx="300" cy="340" r="8" fill="#a855f7"/>
  <circle cx="500" cy="340" r="8" fill="#ec4899"/>
  <circle cx="300" cy="340" r="16" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.5"/>
  <circle cx="500" cy="340" r="16" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.5"/>

  <rect x="100" y="110" width="180" height="28" fill="rgba(255,255,255,0.06)" stroke="url(#accent)" stroke-width="1" rx="6"/>
  <text x="112" y="128" fill="#a855f7" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="2">PIPELINE FLOW</text>

  <text x="100" y="190" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="900" letter-spacing="-1">AUTONOMOUS AGENTS</text>
  <text x="100" y="225" fill="rgba(255,255,255,0.65)" font-family="monospace" font-size="14">Multi-Agent Orchestration Flow</text>

  <g transform="translate(100, 460)">
    <circle cx="8" cy="8" r="4" fill="#a855f7"/>
    <circle cx="8" cy="8" r="8" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>
    <text x="24" y="12" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="12" letter-spacing="1.5">PRODUCTION VERIFIED /// 100% ONLINE</text>
  </g>

  <g transform="translate(620, 460)">
    <text x="0" y="12" fill="#ec4899" font-family="monospace" font-size="14" font-weight="bold">v2.4.0</text>
  </g>
</svg>