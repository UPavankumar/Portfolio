name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main # This action runs when you push to the 'main' branch

jobs:
  deploy: # Changed job name to a simpler 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Optional: add VITE_GROQ_API_KEY as a repo secret to enable the live
          # Alfred chat assistant. Without it the site builds in demo mode.
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          # This token is automatically created by GitHub for authentication
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          
          # 🚨 CRITICAL CHANGE: Using the actual secret name from your GitHub settings 🚨
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTFOLIO_U_PAVAN_KUMAR }}' 
          
          # Your Firebase project ID
          projectId: portfolio-u-pavan-kumar 
          
          # Deploys to the main public URL (https://portfolio-u-pavan-kumar.web.app)
          channelId: live